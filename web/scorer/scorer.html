<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>計分員登入 - 懷智運動會</title>
    <meta name="theme-color" content="#0071e3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f7;
            --bg-elevated: rgba(255,255,255,0.8);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --separator: rgba(0,0,0,0.08);
            --shadow: 0 4px 24px rgba(0,0,0,0.06);
            --radius-card: 18px;
            --radius-pill: 980px;
            --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
            --color-success: #34c759;
            --color-danger: #ff3b30;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #000000;
                --bg-secondary: #1d1d1f;
                --bg-elevated: rgba(29,29,31,0.82);
                --text-primary: #f5f5f7;
                --accent: #0a84ff;
                --separator: rgba(255,255,255,0.12);
                --shadow: 0 4px 24px rgba(0,0,0,0.45);
            }
        }
        * { box-sizing: border-box; }
        html { color-scheme: light dark; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }
        .container {
            background: var(--bg-elevated);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-card);
            border: 1px solid var(--separator);
            box-shadow: var(--shadow);
            padding: 48px 32px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            animation: fadeUp 0.45s var(--ease);
        }
        .logo { font-size: 40px; margin-bottom: 8px; }
        .title {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 17px;
        }
        .login-form { text-align: left; }
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
        }
        .form-input {
            width: 100%;
            min-height: 44px;
            padding: 12px 16px;
            border: 1px solid var(--separator);
            border-radius: 12px;
            font-size: 17px;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }
        .login-btn {
            width: 100%;
            min-height: 44px;
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-pill);
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s var(--ease);
        }
        .login-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }
        .login-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }
        .error-message { color: var(--color-danger); font-size: 13px; margin-top: 8px; text-align: center; }
        .success-message { color: var(--color-success); font-size: 13px; margin-top: 8px; text-align: center; }
        .loading { display: none; color: var(--accent); margin-top: 8px; }
        .footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--separator);
            color: var(--text-secondary);
            font-size: 13px;
        }
        .back-link {
            color: var(--accent);
            text-decoration: none;
            margin-top: 16px;
            display: inline-block;
            min-height: 44px;
            line-height: 44px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏆</div>
        <div class="title">記分員登入</div>
        <div class="subtitle">請輸入您的記分員賬戶信息</div>
        
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">用戶名</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-input" 
                    placeholder="請輸入用戶名"
                    required
                >
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">密碼</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-input" 
                    placeholder="請輸入密碼"
                    required
                >
            </div>
            
            <button type="submit" class="login-btn" id="loginBtn">
                登入
            </button>
            
            <div class="loading" id="loading">
                登入中...
            </div>
            
            <div id="message"></div>
        </form>
        
        <div class="footer">
            <div>如有問題，請聯繫管理員</div>
            <a href="/admin/" class="back-link">返回管理後台</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loading = document.getElementById('loading');
            const message = document.getElementById('message');
            
            // 顯示載入狀態
            loginBtn.disabled = true;
            loginBtn.textContent = '登入中...';
            loading.style.display = 'block';
            message.innerHTML = '';
            
            try {
                const response = await fetch('/api/scorer/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // 登入成功，保存記分員信息
                    localStorage.setItem('scorerInfo', JSON.stringify(data.scorer));
                    
                    message.innerHTML = '<div class="success-message">登入成功！正在跳轉...</div>';
                    
                    // 跳轉到記分員工作台
                    setTimeout(() => {
                        window.location.href = '/scorer-dashboard.html';
                    }, 1000);
                } else {
                    message.innerHTML = `<div class="error-message">${data.message}</div>`;
                }
            } catch (error) {
                console.error('登入錯誤:', error);
                message.innerHTML = '<div class="error-message">登入失敗，請檢查網絡連接</div>';
            } finally {
                // 恢復按鈕狀態
                loginBtn.disabled = false;
                loginBtn.textContent = '登入';
                loading.style.display = 'none';
            }
        });
        
        // 檢查是否已經登入
        const savedScorer = localStorage.getItem('scorerInfo');
        if (savedScorer) {
            try {
                const scorerData = JSON.parse(savedScorer);
                // 如果已經登入，直接跳轉到工作台
                window.location.href = '/scorer-dashboard.html';
            } catch (error) {
                localStorage.removeItem('scorerInfo');
            }
        }
    </script>
</body>
</html>
