name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "server/**"
      - "web/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/wjcs-sportsdays

jobs:
  build-and-push:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: app_version
        run: |
          set -euo pipefail
          VERSION="$(node <<'EOF'
          const fs = require('fs');
          const files = [
            'package.json',
            'server/package.json',
            'web/public/package.json',
            'web/admin/package.json',
          ];
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(pkg.version)) {
            throw new Error(`package.json version must be x.y.z (got: ${pkg.version})`);
          }
          const [major, minor, patch] = pkg.version.split('.').map(Number);
          const next = `${major}.${minor}.${patch + 1}`;
          for (const file of files) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.version = next;
            fs.writeFileSync(file, `${JSON.stringify(json, null, 2)}\n`);
          }
          process.stdout.write(next);
          EOF
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped version to $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.app_version.outputs.version }}
            type=raw,value=v${{ steps.app_version.outputs.version }}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json server/package.json web/public/package.json web/admin/package.json
          git commit -m "chore: bump version to ${{ steps.app_version.outputs.version }} [skip ci]"
          git pull --rebase origin main
          git push
