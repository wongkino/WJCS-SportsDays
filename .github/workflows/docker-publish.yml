name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "client-public/**"
      - "client-admin/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        run: |
          VERSION="$(node -p "require('./server/package.json').version")"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version must be x.y.z (got: $VERSION)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/wjcs-sportsdays-backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/wjcs-sportsdays-backend:${{ steps.app_version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/wjcs-sportsdays-backend:v${{ steps.app_version.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push public frontend
        uses: docker/build-push-action@v6
        with:
          context: ./client-public
          file: ./client-public/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/wjcs-sportsdays-public:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/wjcs-sportsdays-public:${{ steps.app_version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/wjcs-sportsdays-public:v${{ steps.app_version.outputs.version }}
          cache-from: type=gha,scope=public
          cache-to: type=gha,mode=max,scope=public

      - name: Build and push admin frontend
        uses: docker/build-push-action@v6
        with:
          context: ./client-admin
          file: ./client-admin/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/wjcs-sportsdays-admin:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/wjcs-sportsdays-admin:${{ steps.app_version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/wjcs-sportsdays-admin:v${{ steps.app_version.outputs.version }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
