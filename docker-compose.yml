name: sport

services:
  mariadb:
    image: mariadb:11
    container_name: sport-db
    networks:
      - sportday-network
    volumes:
      - ./db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wjcssportsdays
      MYSQL_USER: wjcsuser
      MYSQL_PASSWORD: wjcspassword
      TZ: Asia/Hong_Kong
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/wongkino/wjcs-sportsdays:${APP_VERSION:-latest}
    container_name: sport-app
    networks:
      - sportday-network
    ports:
      - "3200:3200"
    environment:
      NODE_ENV: production
      TZ: Asia/Hong_Kong
      PORT: 3200
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: wjcsuser
      DB_PASSWORD: wjcspassword
      DB_NAME: wjcssportsdays
      PUBLIC_WEB_DIR: /app/web/public
      ADMIN_WEB_DIR: /app/web/admin
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/api/events').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  sportday-network:
    driver: bridge
    external: true
