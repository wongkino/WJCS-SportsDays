services:
  backend:
    image: node:18-alpine
    container_name: sport-backend
    networks:
      - sportday-network
    ports:
      - "3300:3300"
    volumes:
      - ./server:/app
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3300
    command: >
      sh -c "
        apk add --no-cache python3 make g++ sqlite-dev musl-dev &&
        cd /app &&
        npm install express cors sqlite3 body-parser multer csv-parser &&
        node index.js
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3300/api/events"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  public-frontend:
    image: node:18-alpine
    container_name: sport-public-frontend
    networks:
      - sportday-network
    expose:
      - "3000"
    volumes:
      - ./client-public:/app
    environment:
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0
      - WDS_SOCKET_HOST=0.0.0.0
      - WDS_SOCKET_PORT=3000
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
    command: >
      sh -c "
        cd /app &&
        npm install &&
        npm start
      "
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://0.0.0.0:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  admin-frontend:
    image: node:18-alpine
    container_name: sport-admin-frontend
    networks:
      - sportday-network
    expose:
      - "3000"
    volumes:
      - ./client-admin:/app
    environment:
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0
      - WDS_SOCKET_HOST=0.0.0.0
      - WDS_SOCKET_PORT=3200
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
      - PUBLIC_URL=/
    command: >
      sh -c "
        cd /app &&
        npm install &&
        npm start
      "
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://0.0.0.0:3200/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: sport-nginx
    networks:
      - sportday-network
    ports:
      - "3200:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./client-admin/public/scorer.html:/usr/share/nginx/html/scorer.html
      - ./client-admin/public/scorer-dashboard.html:/usr/share/nginx/html/scorer-dashboard.html
    depends_on:
      - public-frontend
      - admin-frontend
      - backend
    restart: unless-stopped

networks:
  sportday-network:
    driver: bridge
    external: true

volumes:
  data:
    driver: local
