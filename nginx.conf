events {
    worker_connections 1024;
}

http {
    upstream public_frontend {
        server public-frontend:3000;
    }
    
    upstream admin_frontend {
        server admin-frontend:3000;
    }
    
    upstream backend {
        server backend:3300;
    }

    server {
        listen 80;
        server_name localhost;

        # 管理後台 - /admin.html 路徑 (代理到React應用根路徑)
        location /admin.html {
            proxy_pass http://admin_frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 靜態文件路由 - 根據 Referer 決定
        location /static/ {
            # 如果 Referer 包含 admin.html，路由到 admin_frontend
            if ($http_referer ~* "/admin\.html") {
                proxy_pass http://admin_frontend;
                break;
            }
            # 否則路由到 public_frontend
            proxy_pass http://public_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 觀眾顯示畫面 - 根路徑
        location / {
            proxy_pass http://public_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 記分員頁面 - 直接提供靜態文件
        location /scorer.html {
            root /usr/share/nginx/html;
            try_files /scorer.html =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # 記分員工作台頁面 - 直接提供靜態文件
        location /scorer-dashboard.html {
            root /usr/share/nginx/html;
            try_files /scorer-dashboard.html =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # API 路由
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }
}
