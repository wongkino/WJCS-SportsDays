events {
    worker_connections 1024;
}

http {
    upstream public_frontend {
        server public-frontend:3000;
    }

    upstream admin_frontend {
        server admin-frontend:3000;
    }

    upstream backend {
        server backend:3300;
    }

    server {
        listen 80;
        server_name localhost;
        absolute_redirect off;

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /scorer.html {
            root /usr/share/nginx/html;
            try_files /scorer.html =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location = /scorer-dashboard.html {
            root /usr/share/nginx/html;
            try_files /scorer-dashboard.html =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location = /admin.html {
            return 301 /admin/;
        }

        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            proxy_pass http://admin_frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://public_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
