name: sport

services:
  backend:
    image: ghcr.io/wongkino/wjcs-sportsdays-backend:${APP_VERSION:-latest}
    container_name: sport-backend
    networks:
      - sportday-network
    ports:
      - "3300:3300"
    volumes:
      - /home/wjcsit/sport/data:/app/data
    environment:
      NODE_ENV: production
      PORT: 3300
      DB_PATH: /app/data/sportday.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3300/api/events"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  public-frontend:
    image: ghcr.io/wongkino/wjcs-sportsdays-public:${APP_VERSION:-latest}
    container_name: sport-public-frontend
    networks:
      - sportday-network
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  admin-frontend:
    image: ghcr.io/wongkino/wjcs-sportsdays-admin:${APP_VERSION:-latest}
    container_name: sport-admin-frontend
    networks:
      - sportday-network
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: sport-nginx
    networks:
      - sportday-network
    ports:
      - "3200:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client-admin/public/scorer.html:/usr/share/nginx/html/scorer.html:ro
      - ./client-admin/public/scorer-dashboard.html:/usr/share/nginx/html/scorer-dashboard.html:ro
    depends_on:
      - public-frontend
      - admin-frontend
      - backend
    restart: unless-stopped

networks:
  sportday-network:
    driver: bridge
    external: true
